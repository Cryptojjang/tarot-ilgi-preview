<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0E1024"><title>타로 일기 (미리보기)</title><style>/* 타로 일기: 밤하늘 + 금박 테마 */
:root {
  --bg: #0e1024;
  --bg2: #161936;
  --panel: rgba(255, 255, 255, 0.055);
  --panel-line: rgba(212, 175, 90, 0.22);
  --gold: #d4af5a;
  --gold-soft: #f0d99b;
  --ink: #f4eee2;
  --sub: #a9a6bd;
  --muted: #7d7a96;
  --yes: #5ccf95;
  --no: #f07b7b;
  --maybe: #f0c46b;
  color-scheme: dark;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-size: 16px;
  line-height: 1.55;
  word-break: keep-all;
  overflow-wrap: anywhere;
}

body {
  font-family: "Toss Product Sans", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", Pretendard, "Noto Sans KR", sans-serif;
  background:
    radial-gradient(1200px 600px at 50% -200px, rgba(110, 88, 200, 0.35), transparent 70%),
    radial-gradient(2px 2px at 20% 12%, rgba(255, 255, 255, 0.7), transparent 60%),
    radial-gradient(1.5px 1.5px at 78% 8%, rgba(255, 255, 255, 0.6), transparent 60%),
    radial-gradient(1.5px 1.5px at 62% 22%, rgba(255, 255, 255, 0.5), transparent 60%),
    radial-gradient(1px 1px at 35% 30%, rgba(255, 255, 255, 0.6), transparent 60%),
    var(--bg);
  background-attachment: fixed;
  min-height: 100vh;
}

button,
input,
textarea {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
}

.page {
  max-width: 520px;
  margin: 0 auto;
  min-height: 100vh;
  min-height: 100dvh;
  padding: 12px 20px calc(28px + env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.page.has-tab {
  padding-bottom: calc(96px + env(safe-area-inset-bottom));
}

.spacer {
  flex: 1;
  min-height: 8px;
}

.loading {
  padding: 40vh 20px 0;
  text-align: center;
  color: var(--sub);
}

.center {
  text-align: center;
}
.muted {
  color: var(--sub);
  margin: 0;
}
.small {
  font-size: 13px;
}
h1,
h2,
h3 {
  margin: 0;
  letter-spacing: -0.02em;
}
h1 {
  font-size: 24px;
  line-height: 1.4;
  white-space: pre-line;
}

/* 상단 */
.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 44px;
}
.top-title {
  font-weight: 700;
  font-size: 17px;
}
.top-title.left {
  font-size: 22px;
}
.brand {
  font-weight: 800;
  font-size: 19px;
  color: var(--gold-soft);
  letter-spacing: -0.01em;
}
.brand-mark {
  color: var(--gold);
}
.streak-pill {
  font-size: 13px;
  font-weight: 700;
  color: var(--gold-soft);
  border: 1px solid var(--panel-line);
  background: rgba(212, 175, 90, 0.1);
  border-radius: 999px;
  padding: 4px 12px;
}
.icon-btn {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  border: 0;
  background: transparent;
  font-size: 20px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.icon-btn:disabled {
  opacity: 0.25;
}
.icon-btn.ghost {
  visibility: hidden;
}
.hello {
  margin: -4px 0 0;
  color: var(--sub);
  font-size: 15px;
}

/* 카드 */
.card-back {
  position: relative;
  width: 100%;
  aspect-ratio: 300 / 504;
  border-radius: 8px;
  color: var(--gold);
  background:
    radial-gradient(circle at 50% 50%, rgba(212, 175, 90, 0.16), transparent 60%),
    repeating-linear-gradient(45deg, rgba(212, 175, 90, 0.06) 0 2px, transparent 2px 9px),
    linear-gradient(160deg, #262a5c, #13153a);
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35), inset 0 0 0 1px rgba(212, 175, 90, 0.35);
  overflow: hidden;
}
.card-back svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}
.card-face {
  width: 100%;
  aspect-ratio: 300 / 504;
  border-radius: 8px;
  overflow: hidden;
  background: #efe6d2;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
}
.card-face img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.card-face.rev img {
  transform: rotate(180deg);
}

.flip {
  border: 0;
  padding: 0;
  background: none;
  width: 100%;
  perspective: 900px;
  display: block;
}
.flip-inner {
  position: relative;
  display: block;
  width: 100%;
  aspect-ratio: 300 / 504;
  transition: transform 0.7s cubic-bezier(0.3, 0.7, 0.2, 1);
  transform-style: preserve-3d;
}
.flip.on .flip-inner {
  transform: rotateY(180deg);
}
.flip-back,
.flip-front {
  position: absolute !important;
  inset: 0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}
.flip-front {
  transform: rotateY(180deg);
}
.flip:not(:disabled) .flip-back {
  animation: glow 1.6s ease-in-out infinite;
}
@keyframes glow {
  50% {
    box-shadow: 0 0 22px rgba(212, 175, 90, 0.55), inset 0 0 0 1px rgba(212, 175, 90, 0.6);
  }
}

/* 홈 히어로 */
.hero {
  display: flex;
  gap: 18px;
  align-items: center;
  padding: 18px;
  border-radius: 20px;
  background: linear-gradient(150deg, rgba(120, 96, 210, 0.28), rgba(25, 28, 70, 0.6));
  border: 1px solid var(--panel-line);
  cursor: pointer;
}
.hero-stack {
  position: relative;
  width: 96px;
  height: 162px;
  flex: none;
}
.hero-stack .card-back {
  position: absolute;
  width: 92px;
  left: 0;
  top: 0;
}
.hero-stack .hs0 {
  transform: rotate(-9deg) translate(-6px, 4px);
  opacity: 0.6;
}
.hero-stack .hs1 {
  transform: rotate(7deg) translate(8px, 2px);
  opacity: 0.8;
}
.hero-stack .hs2 {
  animation: float 3.2s ease-in-out infinite;
}
@keyframes float {
  50% {
    transform: translateY(-6px);
  }
}
.hero-card {
  width: 96px;
  flex: none;
}
.hero-text h2 {
  font-size: 21px;
  margin: 2px 0 6px;
}
.hero-text h2 em {
  font-style: normal;
  font-size: 13px;
  color: var(--maybe);
}
.hero-text p {
  margin: 0 0 10px;
  color: var(--sub);
  font-size: 14px;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.hero-link {
  color: var(--gold-soft);
  font-weight: 700;
  font-size: 14px;
}
.panel-kicker {
  font-size: 12px;
  font-weight: 700;
  color: var(--gold);
  letter-spacing: 0.02em;
}

/* 패널 */
.panel {
  padding: 16px;
  border-radius: 16px;
  background: var(--panel);
  border: 1px solid rgba(255, 255, 255, 0.07);
}
.panel p {
  margin: 8px 0 0;
}

.rate-head {
  display: flex;
  gap: 12px;
  align-items: center;
}
.mini {
  width: 40px;
  flex: none;
}
.rate-btns {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 12px;
}
.rate-btns button {
  border: 1px solid var(--panel-line);
  background: rgba(212, 175, 90, 0.08);
  border-radius: 12px;
  padding: 10px 4px;
  font-size: 14px;
  font-weight: 600;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.stats > * {
  border: 0;
  background: var(--panel);
  border-radius: 14px;
  padding: 12px 6px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  text-align: center;
  min-width: 0;
}
.stats b {
  font-size: 18px;
  color: var(--gold-soft);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.stats b small {
  font-size: 12px;
  color: var(--muted);
}
.stats span {
  font-size: 12px;
  color: var(--sub);
}

.section-title {
  font-size: 17px;
  margin-top: 6px;
}

.topic-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
.topic {
  border: 1px solid rgba(255, 255, 255, 0.08);
  background: var(--panel);
  border-radius: 16px;
  padding: 14px 10px 12px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
  text-align: left;
  min-height: 112px;
}
.topic b {
  font-size: 16px;
}
.topic span:last-child {
  font-size: 12px;
  color: var(--sub);
  line-height: 1.35;
}
.topic-icon {
  width: 32px;
  height: 32px;
  border-radius: 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 17px;
  margin-bottom: 6px;
  background: rgba(212, 175, 90, 0.14);
  color: var(--gold-soft);
}
.topic-icon.big {
  width: 52px;
  height: 52px;
  font-size: 26px;
  border-radius: 16px;
}
.t-love .topic-icon {
  background: rgba(240, 120, 150, 0.18);
  color: #ffadc2;
}
.t-money .topic-icon {
  background: rgba(92, 207, 149, 0.16);
  color: #9be8bf;
}
.t-work .topic-icon {
  background: rgba(110, 160, 255, 0.18);
  color: #a9c6ff;
}

.wide-card {
  display: flex;
  align-items: center;
  gap: 14px;
  border: 1px solid var(--panel-line);
  border-radius: 16px;
  padding: 14px 16px;
  background: linear-gradient(120deg, rgba(212, 175, 90, 0.14), rgba(255, 255, 255, 0.03));
  text-align: left;
}
.wide-card.gift {
  background: linear-gradient(120deg, rgba(240, 120, 150, 0.16), rgba(255, 255, 255, 0.03));
  border-color: rgba(240, 120, 150, 0.28);
}
.wide-card > span:nth-child(2) {
  flex: 1;
  display: flex;
  flex-direction: column;
}
.wide-card small {
  color: var(--sub);
  font-size: 13px;
}
.yn-mark {
  width: 44px;
  height: 44px;
  border-radius: 14px;
  background: rgba(0, 0, 0, 0.25);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 14px;
  color: var(--gold-soft);
  flex: none;
}
.chev {
  color: var(--muted);
  font-size: 22px;
}

.disclaimer {
  font-size: 12px;
  color: var(--muted);
  text-align: center;
  margin: 8px 0 0;
}

/* 버튼 */
.btn {
  border: 0;
  border-radius: 16px;
  padding: 15px 18px;
  font-weight: 700;
  font-size: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  width: 100%;
}
.btn small {
  font-weight: 500;
  font-size: 12px;
  opacity: 0.75;
}
.btn.primary {
  background: linear-gradient(180deg, #e6c46e, #c9a227);
  color: #1b1530;
  box-shadow: 0 6px 20px rgba(201, 162, 39, 0.3);
}
.btn.primary:disabled {
  opacity: 0.35;
  box-shadow: none;
}
.btn.secondary {
  background: rgba(255, 255, 255, 0.08);
  color: var(--ink);
  border: 1px solid rgba(255, 255, 255, 0.1);
}
.btn.ghost {
  background: transparent;
  color: var(--sub);
  padding: 10px;
}
.btn.big {
  padding: 18px;
  font-size: 17px;
}
.btn.small {
  padding: 10px 14px;
  font-size: 14px;
  width: auto;
  align-self: flex-end;
  margin-top: 8px;
}
.btn.inline {
  display: inline-flex;
  width: auto;
  padding: 9px 14px;
  font-size: 14px;
  border-radius: 12px;
}

/* 탭 바 */
.tabbar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  display: flex;
  justify-content: center;
  gap: 0;
  padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
  background: rgba(14, 16, 36, 0.92);
  backdrop-filter: blur(12px);
  border-top: 1px solid rgba(255, 255, 255, 0.06);
  z-index: 20;
}
.tabbar button {
  flex: 1;
  max-width: 170px;
  border: 0;
  background: none;
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 4px;
}
.tabbar button span {
  font-size: 19px;
  line-height: 1.2;
}
.tabbar button.on {
  color: var(--gold-soft);
}

/* 질문 */
.ask-hero {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 8px;
}
.q-input,
.field input,
.choice-inputs input,
.memo textarea {
  width: 100%;
  border-radius: 14px;
  border: 1px solid rgba(255, 255, 255, 0.12);
  background: rgba(255, 255, 255, 0.06);
  padding: 14px;
  font-size: 16px;
  outline: none;
  resize: none;
}
.q-input:focus,
.field input:focus,
.choice-inputs input:focus,
.memo textarea:focus {
  border-color: var(--gold);
}
.quick {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 10px;
}
.chip {
  font-size: 13px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(212, 175, 90, 0.12);
  color: var(--gold-soft);
}
.btn-chip {
  border: 1px solid rgba(212, 175, 90, 0.25);
  padding: 7px 12px;
}
.btn-chip.on {
  background: var(--gold);
  color: #1b1530;
  font-weight: 700;
}
.choice-inputs {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.choice-inputs label,
.field {
  display: flex;
  align-items: center;
  gap: 10px;
}
.choice-inputs label span {
  width: 36px;
  height: 36px;
  flex: none;
  border-radius: 10px;
  background: rgba(212, 175, 90, 0.16);
  color: var(--gold-soft);
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
}
.field {
  flex-direction: column;
  align-items: stretch;
  gap: 6px;
}
.field span {
  font-size: 13px;
  color: var(--sub);
  font-weight: 600;
}

/* 카드 뽑기 */
.q-bubble {
  margin: 0;
  padding: 12px 14px;
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.06);
  color: var(--gold-soft);
  font-size: 15px;
  text-align: center;
}
.slots {
  display: flex;
  justify-content: center;
  gap: 14px;
}
.slot {
  width: 78px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}
.slot-card {
  width: 100%;
  aspect-ratio: 300 / 504;
  border-radius: 8px;
  border: 1.5px dashed rgba(212, 175, 90, 0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  font-weight: 700;
}
.slot.filled .slot-card {
  border: 0;
  animation: drop 0.35s ease-out;
}
@keyframes drop {
  from {
    transform: translateY(-30px) scale(1.1);
    opacity: 0;
  }
}
.slot-label {
  font-size: 12px;
  color: var(--sub);
  text-align: center;
  line-height: 1.3;
}
.pick-guide {
  text-align: center;
  margin: 4px 0 0;
  color: var(--sub);
}
.pick-guide b {
  color: var(--gold-soft);
}
.deck {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 8px 6px;
  padding: 4px 2px;
}
.deck-card {
  position: relative;
  border: 0;
  padding: 0;
  background: none;
  animation: deal 0.45s ease-out both;
  transition: transform 0.2s, opacity 0.3s;
}
.deck-card:active {
  transform: translateY(-6px);
}
.deck-card.picked {
  opacity: 0.25;
  transform: translateY(-8px);
}
.deck-num {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--gold);
  color: #1b1530;
  font-weight: 800;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
}
@keyframes deal {
  from {
    transform: translateY(40px) rotate(-8deg);
    opacity: 0;
  }
}
.shuffle {
  position: relative;
  height: 280px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
}
.shuf {
  position: absolute !important;
  width: 110px !important;
  top: 10px;
  left: calc(50% - 55px);
  animation: shuf 0.7s ease-in-out infinite alternate;
}
.shuf.s0 { animation-delay: 0s; }
.shuf.s1 { animation-delay: 0.12s; }
.shuf.s2 { animation-delay: 0.24s; }
.shuf.s3 { animation-delay: 0.36s; }
.shuf.s4 { animation-delay: 0.48s; }
@keyframes shuf {
  from {
    transform: translateX(-60px) rotate(-10deg);
  }
  to {
    transform: translateX(60px) rotate(10deg);
  }
}

/* 결과 */
.reading-head {
  display: flex;
  flex-direction: column;
  gap: 8px;
  text-align: center;
}
.gift-msg {
  margin: 0;
  font-size: 16px;
  color: #ffc2d1;
}
.spread {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-top: 4px;
}
.spread-item {
  width: 100px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}
.spread.n1 .spread-item {
  width: 170px;
}
.spread-label {
  font-size: 12px;
  color: var(--gold);
  font-weight: 700;
  text-align: center;
  line-height: 1.3;
}
.spread-name {
  font-size: 14px;
  font-weight: 700;
  text-align: center;
  animation: fadeup 0.4s ease-out;
}
.spread-name em {
  font-style: normal;
  font-size: 11px;
  color: var(--maybe);
}
.fade-in {
  animation: fadeup 0.5s ease-out;
}
@keyframes fadeup {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
}
.reading-body {
  display: flex;
  flex-direction: column;
  gap: 12px;
  scroll-margin-top: 12px;
}
.yn-box {
  text-align: center;
  padding: 20px;
  border-radius: 18px;
  border: 1px solid;
}
.yn-box p {
  margin: 4px 0 0;
  color: var(--sub);
}
.yn-title {
  font-size: 40px;
  font-weight: 900;
  letter-spacing: 0.04em;
}
.yn-box.yes {
  border-color: rgba(92, 207, 149, 0.45);
  background: rgba(92, 207, 149, 0.1);
  color: var(--yes);
}
.yn-box.no {
  border-color: rgba(240, 123, 123, 0.45);
  background: rgba(240, 123, 123, 0.1);
  color: var(--no);
}
.yn-box.maybe {
  border-color: rgba(240, 196, 107, 0.45);
  background: rgba(240, 196, 107, 0.1);
  color: var(--maybe);
}
.summary {
  background: linear-gradient(150deg, rgba(120, 96, 210, 0.25), rgba(255, 255, 255, 0.04));
  border-color: var(--panel-line);
}
.summary h2 {
  font-size: 20px;
  margin-top: 4px;
}
.summary ul {
  margin: 10px 0 0;
  padding-left: 18px;
  color: var(--ink);
}
.summary li + li {
  margin-top: 6px;
}
.pos-head {
  display: flex;
  gap: 14px;
  align-items: center;
}
.thumb {
  width: 56px;
  flex: none;
}
.pos h3 {
  font-size: 18px;
  margin: 2px 0;
}
.en {
  font-size: 12px;
  color: var(--muted);
}
.badge {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 6px;
  vertical-align: middle;
}
.badge.up {
  background: rgba(92, 207, 149, 0.15);
  color: var(--yes);
}
.badge.rev {
  background: rgba(240, 196, 107, 0.15);
  color: var(--maybe);
}
.topic-line,
.advice {
  padding: 10px 12px;
  border-radius: 12px;
  background: rgba(0, 0, 0, 0.2);
  font-size: 15px;
}
.topic-line b,
.advice b,
.today-topics b {
  display: block;
  font-size: 12px;
  color: var(--gold);
  margin-bottom: 2px;
}
.advice {
  background: rgba(212, 175, 90, 0.1);
  border: 1px solid rgba(212, 175, 90, 0.2);
}
.today-topics {
  display: grid;
  gap: 8px;
  margin-top: 10px;
  font-size: 15px;
}
.today-topics > div {
  padding: 10px 12px;
  border-radius: 12px;
  background: rgba(0, 0, 0, 0.2);
}
.lucky {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  text-align: center;
  gap: 6px;
}
.lucky > div {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.lucky b {
  color: var(--gold-soft);
  font-size: 17px;
}
.extra {
  border-color: var(--panel-line);
}
.memo-view {
  width: 100%;
  text-align: left;
  border: 1px dashed rgba(255, 255, 255, 0.18);
  background: none;
  border-radius: 12px;
  padding: 12px;
  margin-top: 8px;
  color: var(--sub);
  white-space: pre-wrap;
}
.memo textarea {
  margin-top: 8px;
}
.memo {
  display: flex;
  flex-direction: column;
}
.actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 6px;
}

/* 일기 */
.cal-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
}
.cal-w {
  font-size: 12px;
  color: var(--muted);
  text-align: center;
  padding-bottom: 4px;
}
.cal-day {
  border: 0;
  background: rgba(255, 255, 255, 0.03);
  border-radius: 8px;
  aspect-ratio: 3 / 4.4;
  padding: 2px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  color: var(--muted);
}
.cal-day.today {
  outline: 1.5px solid var(--gold);
}
.cal-day.has {
  background: none;
}
.cal-card {
  width: 100%;
  height: 100%;
  aspect-ratio: auto;
  border-radius: 5px;
  box-shadow: none;
}
.empty {
  color: var(--muted);
  text-align: center;
  padding: 20px 0;
  margin: 0;
}
.entry-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.entry {
  display: flex;
  gap: 12px;
  text-align: left;
  border: 0;
  background: var(--panel);
  border-radius: 14px;
  padding: 12px;
}
.entry-cards {
  display: flex;
  gap: 3px;
  flex: none;
}
.entry-cards .mini {
  width: 30px;
}
.entry-text {
  min-width: 0;
  flex: 1;
}
.entry-text b {
  display: block;
  font-size: 15px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.entry-text p {
  margin: 2px 0 0;
  font-size: 13px;
  color: var(--sub);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.entry-meta {
  font-size: 12px;
  color: var(--muted);
  display: flex;
  gap: 6px;
  align-items: center;
}
.hit {
  font-size: 11px;
  padding: 1px 6px;
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.08);
}
.hit.h2 {
  color: var(--yes);
}
.hit.h1 {
  color: var(--maybe);
}

/* 도감 */
.progress-row {
  display: flex;
  justify-content: space-between;
  font-size: 18px;
}
.progress-row span {
  color: var(--gold-soft);
  font-weight: 700;
}
.bar {
  height: 8px;
  border-radius: 99px;
  background: rgba(255, 255, 255, 0.08);
  margin-top: 8px;
  overflow: hidden;
}
.bar i {
  display: block;
  height: 100%;
  border-radius: 99px;
  background: linear-gradient(90deg, #c9a227, #f0d99b);
}
.filters {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
  margin: 0 -20px;
  padding: 0 20px;
}
.filters::-webkit-scrollbar {
  display: none;
}
.filters .chip {
  white-space: nowrap;
  flex: none;
}
.dex {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px 8px;
}
.dex-item {
  border: 0;
  background: none;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
  align-items: center;
}
.dex-item span {
  font-size: 11px;
  color: var(--muted);
  text-align: center;
  line-height: 1.25;
}
.dex-item.got span {
  color: var(--ink);
}
.dex-item:not(.got) .card-back {
  opacity: 0.45;
}
.sheet-bg {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.6);
  z-index: 30;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  animation: fadeup 0.2s ease-out;
}
.sheet {
  width: 100%;
  max-width: 520px;
  max-height: 88vh;
  overflow-y: auto;
  background: var(--bg2);
  border-radius: 22px 22px 0 0;
  padding: 22px 20px calc(20px + env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.sheet-head {
  display: flex;
  gap: 16px;
  align-items: center;
}
.sheet-card {
  width: 96px !important;
  flex: none;
}
.sheet h2 {
  font-size: 22px;
}
.dex-detail {
  margin: 0;
  display: grid;
  grid-template-columns: 56px 1fr;
  gap: 10px 8px;
  font-size: 15px;
}
.dex-detail dt {
  color: var(--gold);
  font-weight: 700;
  font-size: 13px;
  padding-top: 2px;
}
.dex-detail dd {
  margin: 0;
}

/* 선물 */
.gift-visual {
  position: relative;
  height: 150px;
  display: flex;
  justify-content: center;
  margin-top: 6px;
}
.gift-visual.big {
  height: 200px;
  margin-top: 30px;
}
.gift-visual .card-back {
  position: absolute;
  width: 80px;
  top: 0;
}
.gift-visual.big .card-back {
  width: 104px;
}
.gift-visual .g0 {
  transform: rotate(-14deg) translateX(-56px);
}
.gift-visual .g2 {
  transform: rotate(14deg) translateX(56px);
}
.gift-visual .g1 {
  z-index: 1;
  animation: float 3s ease-in-out infinite;
  box-shadow: 0 0 30px rgba(240, 120, 150, 0.4);
}
.gift-open .brand {
  text-align: center;
  margin-top: 8px;
}

.ad-slot {
  min-height: 0;
}
